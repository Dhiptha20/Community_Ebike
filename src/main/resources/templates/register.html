<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Registration — Community Shared E-Bike</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .register-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-4">
        <div style="width: 50px; height: 50px; border-radius: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem;">
            <i class="fa-solid fa-person-biking"></i>
        </div>
        <h3 class="fw-bold mb-1">Create Rider Account</h3>
        <p class="text-secondary small">Join the community smart e-bike network today</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center small py-2">
        <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/register}" th:object="${riderDto}" method="post">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label fw-semibold small text-secondary">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" th:field="*{fullName}" placeholder="e.g. Ramesh Kumar" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Username</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="Choose a username" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Password</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Min 6 characters" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Email Address</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="rider@example.in" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Phone Number</label>
                <input type="text" class="form-control" th:field="*{phone}" placeholder="+91 9876543210" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-emerald w-100 py-2 fw-bold">
                    <i class="fa-solid fa-user-plus me-2"></i> Register Account
                </button>
            </div>
        </div>
    </form>

    <div class="text-center small text-secondary mt-4">
        Already registered? <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Back to Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
