<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('E-Bikes Fleet Management')}"></head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('bikes')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar('E-Bikes Fleet Management')}"></div>

        <div class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Action Bar: Search, Filter, Add Bike -->
            <div class="custom-card p-3 mb-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <!-- Search & Filter Form -->
                    <form th:action="@{/bikes}" method="get" class="d-flex flex-wrap align-items-center gap-2 flex-grow-1">
                        <div class="input-group" style="max-width: 280px;">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" name="keyword" class="form-control" placeholder="Search by bike code..." th:value="${keyword}">
                        </div>

                        <select name="status" class="form-select" style="max-width: 180px;" onchange="this.form.submit()">
                            <option value="">All Statuses</option>
                            <option value="AVAILABLE" th:selected="${selectedStatus?.name() == 'AVAILABLE'}">Available</option>
                            <option value="IN_USE" th:selected="${selectedStatus?.name() == 'IN_USE'}">In Use</option>
                            <option value="MAINTENANCE" th:selected="${selectedStatus?.name() == 'MAINTENANCE'}">Maintenance</option>
                            <option value="CHARGING" th:selected="${selectedStatus?.name() == 'CHARGING'}">Charging</option>
                            <option value="DISABLED" th:selected="${selectedStatus?.name() == 'DISABLED'}">Disabled</option>
                        </select>

                        <button type="submit" class="btn btn-outline-secondary">Filter</button>
                        <a th:if="${keyword != null || selectedStatus != null}" th:href="@{/bikes}" class="btn btn-link text-muted small">Clear</a>
                    </form>

                    <!-- Add Bike Modal Trigger -->
                    <div>
                        <button type="button" class="btn btn-emerald" data-bs-toggle="modal" data-bs-target="#addBikeModal">
                            <i class="fa-solid fa-plus me-1"></i> Add New E-Bike
                        </button>
                    </div>
                </div>
            </div>

            <!-- E-Bikes Fleet Table -->
            <div class="custom-card">
                <div class="card-header-clean">
                    <h5><i class="fa-solid fa-bicycle text-primary me-2"></i>E-Bike Fleet Directory</h5>
                    <span class="badge bg-light text-secondary border" th:text="${#lists.size(bikes)} + ' Bikes Recorded'">0 Bikes</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th>Bike Code</th>
                                <th>Docking Station</th>
                                <th>Battery Level</th>
                                <th>GPS Location</th>
                                <th>Status</th>
                                <th>Last Updated</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="b : ${bikes}">
                                <td class="fw-bold">
                                    <div class="d-flex align-items-center gap-2">
                                        <div style="width: 32px; height: 32px; border-radius: 8px; background: #ecfdf5; color: #059669; display: flex; align-items: center; justify-content: center;">
                                            <i class="fa-solid fa-bicycle"></i>
                                        </div>
                                        <div>
                                            <div th:text="${b.bikeCode}">EB-101</div>
                                            <span class="small text-muted" th:text="'ID: #' + ${b.bikeId}">ID: #1</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${b.dockingStation != null}" class="badge bg-light text-dark border">
                                        <i class="fa-solid fa-charging-station text-primary me-1"></i>
                                        <span th:text="${b.dockingStation.stationName}">Central Station</span>
                                    </span>
                                    <span th:if="${b.dockingStation == null}" class="badge bg-warning-subtle text-warning border border-warning-subtle">
                                        <i class="fa-solid fa-road me-1"></i> On the Road
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2" style="min-width: 140px;">
                                        <div class="progress flex-grow-1" style="height: 8px;">
                                            <div class="progress-bar"
                                                 th:classappend="${b.batteryLevel < 20} ? 'bg-danger' : (${b.batteryLevel < 50} ? 'bg-warning' : 'bg-success')"
                                                 th:style="'width: ' + ${b.batteryLevel} + '%;'"></div>
                                        </div>
                                        <span class="fw-bold small"
                                              th:classappend="${b.batteryLevel < 20} ? 'text-danger' : 'text-dark'"
                                              th:text="${b.batteryLevel} + '%'">85%</span>
                                        <span th:if="${b.isLowBattery()}" class="pulse-danger" data-bs-toggle="tooltip" title="Battery below 20%!"></span>
                                    </div>
                                </td>
                                <td class="small font-monospace text-muted">
                                    <i class="fa-solid fa-location-dot text-danger me-1"></i>
                                    <span th:text="${b.gpsLatitude != null ? #numbers.formatDecimal(b.gpsLatitude, 1, 4) : '0.0000'}">12.9716</span>,
                                    <span th:text="${b.gpsLongitude != null ? #numbers.formatDecimal(b.gpsLongitude, 1, 4) : '0.0000'}">77.5946</span>
                                </td>
                                <td>
                                    <span th:if="${b.status.name() == 'AVAILABLE'}" class="badge-status badge-available">
                                        <i class="fa-solid fa-circle text-success" style="font-size: 8px;"></i> Available
                                    </span>
                                    <span th:if="${b.status.name() == 'IN_USE'}" class="badge-status badge-in-use">
                                        <i class="fa-solid fa-person-biking text-primary" style="font-size: 8px;"></i> In Use
                                    </span>
                                    <span th:if="${b.status.name() == 'MAINTENANCE'}" class="badge-status badge-maintenance">
                                        <i class="fa-solid fa-wrench text-danger" style="font-size: 8px;"></i> Maintenance
                                    </span>
                                    <span th:if="${b.status.name() == 'CHARGING'}" class="badge-status badge-charging">
                                        <i class="fa-solid fa-bolt text-warning" style="font-size: 8px;"></i> Charging
                                    </span>
                                    <span th:if="${b.status.name() == 'DISABLED'}" class="badge-status badge-disabled">
                                        <i class="fa-solid fa-ban text-muted" style="font-size: 8px;"></i> Disabled
                                    </span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(b.updatedAt, 'dd MMM HH:mm')}">Date</td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                                th:data-bike-id="${b.bikeId}"
                                                th:data-bike-code="${b.bikeCode}"
                                                th:data-battery="${b.batteryLevel}"
                                                th:data-status="${b.status}"
                                                th:data-lat="${b.gpsLatitude}"
                                                th:data-lng="${b.gpsLongitude}"
                                                th:data-station-id="${b.dockingStation != null ? b.dockingStation.stationId : ''}"
                                                onclick="openEditBikeModal(this.getAttribute('data-bike-id'), this.getAttribute('data-bike-code'), this.getAttribute('data-battery'), this.getAttribute('data-status'), this.getAttribute('data-lat'), this.getAttribute('data-lng'), this.getAttribute('data-station-id'))">
                                            <i class="fa-regular fa-pen-to-square"></i>
                                        </button>
                                        <form th:action="@{'/bikes/delete/' + ${b.bikeId}}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this bike?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="fa-regular fa-trash-can"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(bikes)}">
                                <td colspan="7" class="text-center text-muted py-4">No e-bikes found matching criteria.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<!-- Modal: Add New E-Bike -->
<div class="modal fade" id="addBikeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/bikes/add}" th:object="${newBike}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-plus text-primary me-2"></i>Add New E-Bike</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Bike Code</label>
                        <input type="text" class="form-control" th:field="*{bikeCode}" placeholder="e.g. EB-109" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Docking Station</label>
                        <select class="form-select" th:field="*{stationId}">
                            <option value="">No Station (Independent)</option>
                            <option th:each="st : ${stations}" th:value="${st.stationId}" th:text="${st.stationName} + ' (' + ${st.availableSlots} + ' slots free)'"></option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Battery Level (%)</label>
                            <input type="number" min="0" max="100" class="form-control" th:field="*{batteryLevel}" value="100" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="AVAILABLE">AVAILABLE</option>
                                <option value="IN_USE">IN_USE</option>
                                <option value="MAINTENANCE">MAINTENANCE</option>
                                <option value="CHARGING">CHARGING</option>
                                <option value="DISABLED">DISABLED</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold small">GPS Latitude</label>
                            <input type="number" step="0.0001" class="form-control" th:field="*{gpsLatitude}" value="12.9716">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold small">GPS Longitude</label>
                            <input type="number" step="0.0001" class="form-control" th:field="*{gpsLongitude}" value="77.5946">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-emerald fw-bold">Save E-Bike</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: Edit E-Bike -->
<div class="modal fade" id="editBikeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editBikeForm" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fa-regular fa-pen-to-square text-primary me-2"></i>Edit E-Bike</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Bike Code</label>
                        <input type="text" id="editBikeCode" name="bikeCode" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Docking Station</label>
                        <select id="editStationId" name="stationId" class="form-select">
                            <option value="">No Station (Independent)</option>
                            <option th:each="st : ${stations}" th:value="${st.stationId}" th:text="${st.stationName}"></option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Battery Level (%)</label>
                            <input type="number" min="0" max="100" id="editBatteryLevel" name="batteryLevel" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Status</label>
                            <select id="editStatus" name="status" class="form-select">
                                <option value="AVAILABLE">AVAILABLE</option>
                                <option value="IN_USE">IN_USE</option>
                                <option value="MAINTENANCE">MAINTENANCE</option>
                                <option value="CHARGING">CHARGING</option>
                                <option value="DISABLED">DISABLED</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold small">GPS Latitude</label>
                            <input type="number" step="0.0001" id="editLatitude" name="gpsLatitude" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold small">GPS Longitude</label>
                            <input type="number" step="0.0001" id="editLongitude" name="gpsLongitude" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-emerald fw-bold">Update E-Bike</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
