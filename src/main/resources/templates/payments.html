<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Payments & Revenue Ledger')}"></head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('payments')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar('Payments & Revenue Transactions')}"></div>

        <div class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Top Revenue Stats -->
            <div class="row g-3 mb-4">
                <div class="col-md-6 col-lg-4">
                    <div class="stat-card stat-card-emerald">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <span class="stat-label">Total Successful Receipts</span>
                                <div class="stat-value text-success">₹<span th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">0.00</span></div>
                            </div>
                            <div class="stat-icon icon-emerald">
                                <i class="fa-solid fa-indian-rupee-sign"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="stat-card stat-card-blue">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <span class="stat-label">Total Completed Payments</span>
                                <div class="stat-value text-primary" th:text="${#lists.size(payments)}">0</div>
                            </div>
                            <div class="stat-icon icon-blue">
                                <i class="fa-solid fa-receipt"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="stat-card stat-card-amber">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <span class="stat-label">Unsettled Invoices</span>
                                <div class="stat-value text-warning" th:text="${#lists.size(pendingInvoices)}">0</div>
                            </div>
                            <div class="stat-icon icon-amber">
                                <i class="fa-solid fa-clock"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Payments Ledger Table -->
            <div class="custom-card">
                <div class="card-header-clean">
                    <h5><i class="fa-solid fa-credit-card text-primary me-2"></i>Payment Transactions Ledger</h5>
                    <span class="badge bg-light text-secondary border" th:text="${#lists.size(payments)} + ' Transactions'">0 Transactions</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th>Transaction Ref</th>
                                <th>Rider</th>
                                <th>Invoice</th>
                                <th>Amount</th>
                                <th>Payment Mode</th>
                                <th>Date & Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${payments}">
                                <td class="fw-bold font-monospace text-primary" th:text="${p.transactionRef}">TXN-123456</td>
                                <td>
                                    <div class="fw-bold text-dark" th:text="${p.rider.name}">Rider</div>
                                    <span class="small text-muted" th:text="${p.rider.email}">email</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="'Invoice #' + ${p.invoice.invoiceId}">Invoice #1</span>
                                </td>
                                <td class="fw-bold text-success fs-6">
                                    ₹<span th:text="${#numbers.formatDecimal(p.amount, 1, 2)}">81.00</span>
                                </td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary" th:text="${p.paymentMethod}">UPI</span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(p.paymentDate, 'dd MMM yyyy, HH:mm:ss')}">Timestamp</td>
                                <td>
                                    <span th:if="${p.status.name() == 'SUCCESS'}" class="badge-status badge-paid">
                                        <i class="fa-solid fa-circle-check text-success"></i> Success
                                    </span>
                                    <span th:if="${p.status.name() != 'SUCCESS'}" class="badge-status badge-disabled" th:text="${p.status}">Pending</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(payments)}">
                                <td colspan="7" class="text-center text-muted py-4">No payments recorded yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
