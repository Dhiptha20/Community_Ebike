<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Invoices')}"></head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar('My Ride Invoices & Payments')}"></div>

        <div class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="custom-card">
                <div class="card-header-clean">
                    <h5><i class="fa-solid fa-receipt text-primary me-2"></i>My Invoices</h5>
                    <span class="badge bg-light text-secondary border" th:text="${#lists.size(invoices)} + ' Invoices'">0 Invoices</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th>Invoice ID</th>
                                <th>Associated Trip</th>
                                <th>Amount</th>
                                <th>Due Date</th>
                                <th>Date Issued</th>
                                <th>Payment Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inv : ${invoices}">
                                <td class="fw-bold" th:text="'#INV-' + ${inv.invoiceId}">#INV-1</td>
                                <td>
                                    <span th:if="${inv.trip != null}" class="badge bg-light text-dark border">
                                        <i class="fa-solid fa-bicycle text-success me-1"></i> Trip #<span th:text="${inv.trip.tripId}">1</span> (<span th:text="${inv.trip.bike.bikeCode}">EB-101</span>)
                                    </span>
                                    <span th:if="${inv.trip == null}" class="text-muted small">Subscription / General</span>
                                </td>
                                <td class="fw-bold fs-6 text-dark">
                                    ₹<span th:text="${#numbers.formatDecimal(inv.amount, 1, 2)}">81.00</span>
                                </td>
                                <td class="small" th:text="${#temporals.format(inv.dueDate, 'dd MMM yyyy')}">Due Date</td>
                                <td class="small text-muted" th:text="${#temporals.format(inv.createdAt, 'dd MMM yyyy, HH:mm')}">Date</td>
                                <td>
                                    <span th:if="${inv.status.name() == 'PAID'}" class="badge-status badge-paid">
                                        <i class="fa-solid fa-circle-check text-success"></i> Paid
                                    </span>
                                    <span th:if="${inv.status.name() == 'UNPAID'}" class="badge-status badge-unpaid">
                                        <i class="fa-solid fa-clock text-danger"></i> Unpaid
                                    </span>
                                    <span th:if="${inv.status.name() == 'OVERDUE'}" class="badge-status badge-disabled">
                                        Overdue
                                    </span>
                                </td>
                                <td class="text-end">
                                    <button th:if="${inv.status.name() == 'UNPAID'}" type="button" class="btn btn-sm btn-emerald fw-bold"
                                            th:data-inv-id="${inv.invoiceId}"
                                            th:data-amount="${inv.amount}"
                                            th:data-rider-id="${rider != null ? rider.riderId : ''}"
                                            onclick="openPaymentModal(this.getAttribute('data-inv-id'), this.getAttribute('data-amount'), this.getAttribute('data-rider-id'))">
                                        <i class="fa-solid fa-credit-card me-1"></i> Pay Now
                                    </button>
                                    <span th:if="${inv.status.name() == 'PAID'}" class="small text-success fw-bold">
                                        <i class="fa-solid fa-check-double me-1"></i> Settled
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(invoices)}">
                                <td colspan="7" class="text-center text-muted py-4">No invoices recorded.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<!-- Modal: Pay Invoice -->
<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/payments/pay}" method="post">
                <input type="hidden" id="payInvoiceId" name="invoiceId">
                <input type="hidden" id="payRiderId" name="riderId">
                <input type="hidden" name="redirectUrl" value="/rider/invoices">

                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-credit-card text-success me-2"></i>Pay Ride Invoice</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="bg-light p-3 rounded-3 mb-3 border">
                        <span class="small text-muted d-block">Invoice Reference</span>
                        <h5 id="payInvoiceLabel" class="fw-bold mb-0 text-dark">Invoice #</h5>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Total Amount (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="payAmount" name="amount" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Payment Mode</label>
                        <select name="paymentMethod" class="form-select" required>
                            <option value="UPI">UPI (Google Pay / PhonePe / Paytm / BHIM)</option>
                            <option value="CARD">Credit / Debit Card</option>
                            <option value="WALLET">Micromobility Smart Wallet</option>
                            <option value="CASH">Cash at Docking Station</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-emerald fw-bold">Pay & Settle Invoice</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
