<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registered Riders')}"></head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('riders')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar('Registered Riders Directory')}"></div>

        <div class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="custom-card">
                <div class="card-header-clean">
                    <h5><i class="fa-solid fa-users text-primary me-2"></i>Active Rider Community</h5>
                    <span class="badge bg-light text-secondary border" th:text="${#lists.size(riders)} + ' Verified Riders'">0 Riders</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th>Rider ID</th>
                                <th>Name & Profile</th>
                                <th>Email Address</th>
                                <th>Phone Number</th>
                                <th>Status</th>
                                <th>Joined Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${riders}">
                                <td class="fw-bold" th:text="'#R-' + ${r.riderId}">#R-1</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div style="width: 32px; height: 32px; border-radius: 50%; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                                            <span th:text="${r.name.substring(0,1).toUpperCase()}">R</span>
                                        </div>
                                        <div>
                                            <div class="fw-bold text-dark" th:text="${r.name}">Rahul Sharma</div>
                                            <span class="small text-muted" th:text="'@' + ${r.user != null ? r.user.username : 'user'}">@username</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <i class="fa-regular fa-envelope text-muted me-1"></i>
                                    <span th:text="${r.email}">rider@example.com</span>
                                </td>
                                <td>
                                    <i class="fa-solid fa-phone text-muted me-1"></i>
                                    <span th:text="${r.phone}">+91 9876543210</span>
                                </td>
                                <td>
                                    <span th:if="${r.status == 'ACTIVE'}" class="badge-status badge-available">
                                        <i class="fa-solid fa-circle-check text-success"></i> Active
                                    </span>
                                    <span th:if="${r.status != 'ACTIVE'}" class="badge-status badge-disabled">
                                        <i class="fa-solid fa-ban text-muted"></i> Suspended
                                    </span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy')}">Date</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(riders)}">
                                <td colspan="6" class="text-center text-muted py-4">No registered riders found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
