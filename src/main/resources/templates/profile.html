<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('User Profile')}"></head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar('User Account Profile')}"></div>

        <div class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="custom-card">
                        <div class="card-header-clean">
                            <h5><i class="fa-regular fa-user text-primary me-2"></i>My Profile Details</h5>
                            <span class="badge bg-primary-subtle text-primary" th:text="${user.role}">ROLE</span>
                        </div>
                        <div class="p-4">
                            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                                <div style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #0284c7); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold;">
                                    <span th:text="${user.username.substring(0,1).toUpperCase()}">U</span>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-0 text-dark" th:text="${user.fullName}">Full Name</h5>
                                    <span class="text-muted small" th:text="'@' + ${user.username}">@username</span>
                                </div>
                            </div>

                            <form th:action="@{/profile}" th:object="${user}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small">Username</label>
                                        <input type="text" class="form-control bg-light" th:field="*{username}" readonly>
                                        <div class="form-text small">Username cannot be changed.</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small">Email Address</label>
                                        <input type="email" class="form-control bg-light" th:field="*{email}" readonly>
                                        <div class="form-text small">Primary verified email.</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small">Full Name</label>
                                        <input type="text" class="form-control" th:field="*{fullName}" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small">Phone Number</label>
                                        <input type="text" class="form-control" th:field="*{phone}" required>
                                    </div>

                                    <div class="col-12 mt-4 text-end">
                                        <button type="submit" class="btn btn-emerald fw-bold px-4">
                                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
